{% extends 'mainapp/base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}

<h1>Регистрация</h1>

<form method="post"
      action="{% url 'mainapp:register' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
        Зарегистрироваться
    </button>

</form>
<p>
    Уже есть аккаунт?
    <a href="{% url 'mainapp:login' %}">Войти</a>
    </a>
</p>

{% endblock %}
