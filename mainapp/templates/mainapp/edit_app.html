{% extends 'mainapp/base.html' %}

{% block title %}Редактирование{% endblock %}

{% block content %}

<h1>Редактировать приложение</h1>

<form method="post"
      action="{% url 'mainapp:edit_app' app.id %}"
      enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Сохранить
    </button>
</form>

{% endblock %}
