{% extends 'mainapp/base.html' %}

{% block title %}Новый пароль{% endblock %}

{% block content %}

<h1>Установка нового пароля</h1>

{% if validlink %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Сохранить новый пароль
        </button>
    </form>

{% else %}

    <p>
        Эта ссылка для сброса пароля уже недействительна.
    </p>

    <p>
        <a href="{% url 'mainapp:password_reset' %}">
            Запросить новую ссылку
        </a>
    </p>

{% endif %}

{% endblock %}
