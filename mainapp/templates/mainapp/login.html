{% extends 'mainapp/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}

<h1>Вход</h1>
<p>
    <a href="{% url 'mainapp:password_reset' %}">
    Забыли пароль?
    </a>
</p>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <input type="hidden" name="next" value="{{ next|default:'' }}">

    <button type="submit">Войти</button>
</form>

<p>
    Нет аккаунта?
    <a href="{% url 'mainapp:register' %}">
        Зарегистрироваться
    </a>
</p>

{% endblock %}
